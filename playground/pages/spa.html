<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground: SPA</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <nav><a href="/">Home</a><a href="/pricing">Pricing</a><a href="/blog">Blog</a><a href="/sources">Sources</a><a href="/spa">SPA</a><a href="/ingest">Raw ingest</a></nav>
    <h1>Fake SPA</h1>
    <p>These links change the route with <code>history.pushState</code> instead of loading a new page. Each route change, and going back or forward, sends a <code>$pageview</code>.</p>
    <p id="routes"><a href="/spa">Overview</a> · <a href="/spa/settings">Settings</a> · <a href="/spa/billing">Billing</a></p>
    <pre id="route"></pre>
    <script>
      const render = () => { document.getElementById("route").textContent = `Route: ${location.pathname}` }
      document.getElementById("routes").onclick = (event) => {
        const link = event.target.closest("a")
        if (!link) return
        event.preventDefault()
        history.pushState({}, "", link.getAttribute("href"))
        render()
      }
      addEventListener("popstate", render)
      render()
    </script>
  </body>
</html>
