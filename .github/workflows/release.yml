# Pushing a release tag (v1.2.3) checks the image and publishes
# ghcr.io/ninest/flock as 1.2.3, 1.2, 1 and latest. See docs/releasing.md.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
